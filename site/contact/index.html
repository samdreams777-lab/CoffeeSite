<script>

TweenMax.to('.blackscreen', 2, {opacity:0.4, delay:1.7});

TweenMax.from('.title img', 2, {opacity:0, y:100, delay: 0.2, ease:Power3.easeInOut});

TweenMax.from('.titleunder img', 1.7, {opacity:0, y:-100, delay:0.7, ease:Power3.easeInOut});

var page2 = false;

var page3 = false;

	(function($, window, document) {

		

		$(window).bind('scroll', function() {

			console.log($(document).scrollTop());

			if($(document).scrollTop()  < $(document).height()){

			

			$('.blackscreen').css('opacity', 1-(($(window).height()-$(document).scrollTop())/$(window).height()));

				

			//	TweenMax.to('.blackscreen', 0.3, {opacity:1-(($(window).height()-$(document).scrollTop())/$(window).height())});

		}



		if ($(document).scrollTop() > $('.container').height()) {





			$('.page1').addClass('fixed');

			$('.page2').addClass('fixed');

			$('.page3').addClass('fixed');

			if($(document).scrollTop()>1500 && !page2){

				page2= true;

				TweenMax.fromTo('.page2', 2 , {x:2000, opacity:1}, {x:0, opacity:1,  ease:Power3.easeInOut}  );

			}

			if($(document).scrollTop()>2000 && !page3){

				page3= true;

				TweenMax.fromTo('.page3', 2 , {x:2000, opacity:1}, {x:0, opacity:1,  ease:Power3.easeInOut}  );

			}



		}else{

			$('.page1').removeClass('fixed');

			$('.page2').removeClass('fixed');

			$('.page3').removeClass('fixed');

		}

		if($(document).scrollTop() > ($('.container').height()+$('.objectpart').height()-$('.page3').height())){

			$('.page1').removeClass('fixed');

			$('.page2').removeClass('fixed');

			$('.page3').removeClass('fixed');

			$('.page3').css('bottom',0);

		}

	});





$(document).ready(function(){

	$(".scene").parallax();





});

	}(window.jQuery, window, document));

</script>
